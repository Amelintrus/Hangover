name: Draft Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        config:
        - name: Windows
          os: windows-latest

        - name: macOS
          os: macos-latest

        - name: iOS
          os: macos-latest
          target: iOS

        - name: Android32
          os: ubuntu-latest
          target: Android32

        - name: Android64
          os: ubuntu-latest
          target: Android64

    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}

    steps:
      - uses: actions/checkout@v7

      - name: Build the mod
        uses: geode-sdk/build-geode-mod@main
        with:
          combine: true
          target: ${{ matrix.config.target }}

  package:
    name: Package builds
    runs-on: ubuntu-latest
    needs: ['build']

    steps:
      - uses: geode-sdk/build-geode-mod/combine@main
        id: build

      - uses: actions/upload-artifact@v7
        with: 
          name: Build Output
          path: ${{ steps.build.outputs.build-output }}
          
      - uses: softprops/action-gh-release@v3
        with:
          name: Release ${{ github.ref_name }}
          body: "Wooahh new stuff and bug fixes and shit maybe"
          draft: true
          prerelease: ${{ contains(github.ref_name, '-') }}  # pre-release if tag has hyphen
          files: ${{ steps.build.outputs.build-output }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
